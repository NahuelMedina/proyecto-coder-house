      <nav class="nav-container">
        <a href="../index.html"
          ><img src="../assets/img/ejemplo.png" alt="" class="nav-img"
        /></a>
        <ul class="nav-ul menu">

      <i class="fa-solid fa-bars hamburguesa"></i>

    <main class="contacto-container">
      <h2>Contacto</h2>
      <div class="contacto-redes">
        <h3 class="contacto-redes-h3">Mis Redes</h3>
        <div class="contacto-redes-logos-container">
          <img src="" alt="" />
          <img src="" alt="" />
          <img src="" alt="" />
          <img src="" alt="" />
        </div>
      </div>
      <div class="contacto-form-container">
        <form action="">
          <label for="name"
            >Nombre
            <input type="text" name="name" id="name" required />
          </label>
          <label for="last-name"
            >Apellido
            <input type="text" name="last-name" id="last-name" required />
          </label>
          <label for="email"
            >Email
            <input type="email" name="email" id="email" required />
          </label>
          <label for="mensaje"
            >Mensaje
            <textarea name="mensaje" id="mensaje"></textarea>
          </label>
          <button type="submit" class="form-button">Enviar</button>
        </form>
      </div>
    </main>
  </body>
